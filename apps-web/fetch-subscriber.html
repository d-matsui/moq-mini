<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MOQT Late Join Demo</title>
  <style>
    body { font-family: monospace; margin: 20px; background: #1a1a1a; color: #eee; }
    .controls { margin-bottom: 16px; }
    input { background: #333; color: #eee; border: 1px solid #555; padding: 4px 8px; margin-right: 8px; }
    button { padding: 6px 16px; margin-right: 8px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    canvas { background: #000; border: 1px solid #333; display: block; margin-bottom: 16px; }
    #log { background: #111; padding: 12px; height: 300px; overflow-y: auto; white-space: pre; font-size: 12px; border: 1px solid #333; }
    .timing { font-size: 18px; margin: 12px 0; padding: 8px; border: 1px solid #555; }
    .timing .label { color: #888; }
    .timing .value { color: #0f0; font-weight: bold; }
    .section { margin-bottom: 24px; }
  </style>
</head>
<body>
  <h2>MOQT Late Join Demo</h2>
  <p>Compare time-to-first-frame: NextGroupStart vs LargestObject + Joining FETCH</p>
  <div class="controls">
    <label>Relay: <input id="relay-url" value="https://localhost:4433"></label>
    <label>Namespace: <input id="namespace" value="daiki/example"></label>
    <label>Track: <input id="track-name" value=""></label>
    <script>document.getElementById('track-name').value = 'video-' + new Date().toTimeString().slice(0,5).replace(':','');</script>
    <label>FETCH groups back: <input id="fetch-groups" value="1" type="number" min="1" max="30" style="width: 40px"></label>
  </div>
  <div class="controls">
    <button id="btn-next-group">Join (NextGroupStart)</button>
    <button id="btn-fetch">Join (LargestObject + FETCH)</button>
    <button id="stop-btn" disabled>Stop</button>
  </div>
  <div class="timing" id="timing" style="display:none">
    <span class="label">Time to first frame: </span>
    <span class="value" id="timing-value">—</span>
  </div>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="log"></div>
  <script type="module" src="/src/app/fetch-subscriber.ts"></script>
</body>
</html>
